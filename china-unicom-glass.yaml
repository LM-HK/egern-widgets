name: 中国联通小组件 · 透明版
description: 中国联通 话费 语音 流量小组件（含定时保活）；glass 默认透明
author: iBL3ND · glass fork
icon: https://iili.io/nEuB6Jt.png
compat_arguments:
  cuCapture: 'true'
  cuGeneralFlow: 'true'
  cuDirectionalFlow: 'true'
  cuWidgetStyle: 'glass'
compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 直接打开 App 就可以（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuGeneralFlow:
    name: 显示通用流量
    description: 小组件流量统计包含通用流量（关闭则只统计定向流量）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuDirectionalFlow:
    name: 显示定向流量
    description: 小组件流量统计包含定向流量（关闭则只统计通用流量）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuWidgetStyle:
    name: 样式
    description: glass 透明 / classic 原版
    default_value: 'glass'
    options:
    - 'glass'
    - 'classic'
dns: {}
scriptings:
- generic:
    name: china-unicom-glass
    script_url: https://raw.githubusercontent.com/LM-HK/egern-widgets/main/china-unicom-glass.js
    env:
      CU_SHOW_GENERAL_FLOW: '{{{cuGeneralFlow}}}'
      CU_SHOW_DIRECTIONAL_FLOW: '{{{cuDirectionalFlow}}}'
      WIDGET_STYLE: '{{{cuWidgetStyle}}}'
- http_request:
    name: 中国联通 App 自动捕获
    match: '^https://m\.clien[{{{cuCapture}}}]\.10010\.com/'
    script_url: https://raw.githubusercontent.com/LM-HK/egern-widgets/main/china-unicom-glass.js
- schedule:
    name: 中国联通保活
    cron: '*/20 * * * *'
    script_url: https://raw.githubusercontent.com/LM-HK/egern-widgets/main/china-unicom-glass.js
mitm:
  hostnames:
    includes:
    - m.client.10010.com
widgets:
- name: china-unicom
  script_name: china-unicom-glass
