name: 中国电信小组件 · 透明版
description: 中国电信 话费 语音 流量小组件（App RSA 登录 + 自动重登）；glass 默认透明
author: iBL3ND · glass fork
icon: https://iili.io/nEufFXR.png
homepage: https://telecom.nufe.ccwu.cc
compat_arguments:
  ctPhone: ''
  ctPassword: ''
  ctDeviceId: ''
  ctShowGeneralFlow: 'true'
  ctShowDirectionalFlow: 'true'
  ctShowUsedFlow: 'false'
  ctShowUsedVoice: 'false'
  ctDedicatedVoice: '0'
  ctTitle: ''
  ctWidgetStyle: 'glass'
compat_arguments_schema:
  ctPhone:
    name: 手机号
    description: 中国电信手机号
    default_value: ''
  ctPassword:
    name: 服务密码
    description: 电信APP 设置 账户与安全里 获取服务密码
    default_value: ''
  ctDeviceId:
    name: 设备 ID
    description: '复制网站去浏览器打开获取设备ID  使用步骤：1.使用短信登录授权设备 2. 复制显示的设备 ID 在此填写 3.获取方式：网站 https://telecom.nufe.ccwu.cc'
    default_value: ''
  ctShowGeneralFlow:
    name: 显示通用流量
    description: 关闭则只统计定向流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowDirectionalFlow:
    name: 显示定向流量
    description: 关闭则只统计通用流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctDedicatedVoice:
    name: 专属语音分钟数
    description: 电信接口只返回通用+专属合计，填专属语音的分钟数后只显示通用语音；不填或填 0 显示合计
    default_value: '0'
  ctTitle:
    name: 小组件标题
    description: 默认"中国电信"，可自定义
    default_value: ''
  ctWidgetStyle:
    name: 样式
    description: glass 透明 / classic 原版
    default_value: 'glass'
    options:
    - 'glass'
    - 'classic'
dns: {}
scriptings:
- generic:
    name: china-telecom-glass
    script_url: https://raw.githubusercontent.com/LM-HK/egern-widgets/main/china-telecom-glass.js
    env:
      CT_PHONE: '{{{ctPhone}}}'
      CT_PASSWORD: '{{{ctPassword}}}'
      CT_DEVICE_ID: '{{{ctDeviceId}}}'
      CT_SHOW_GENERAL_FLOW: '{{{ctShowGeneralFlow}}}'
      CT_SHOW_DIRECTIONAL_FLOW: '{{{ctShowDirectionalFlow}}}'
      CT_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
      CT_SHOW_USED_VOICE: '{{{ctShowUsedVoice}}}'
      CT_DEDICATED_VOICE: '{{{ctDedicatedVoice}}}'
      CT_TITLE: '{{{ctTitle}}}'
      WIDGET_STYLE: '{{{ctWidgetStyle}}}'
widgets:
- name: china-telecom
  script_name: china-telecom-glass
